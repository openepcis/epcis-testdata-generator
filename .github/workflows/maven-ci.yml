# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Add "Run Workflow" button to GitHub Actions UI
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: checkout git submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: maven
          server-id: openepcis-ossrh
          server-username: OPENEPCIS_OSSRH_USERNAME
          server-password: OPENEPCIS_OSSRH_PASSWORD

      - name: Compile and Verify Test Data Module
        env:
          GITLAB_DEPLOY_USER: ${{ secrets.GITLAB_DEPLOY_USER }}
          GITLAB_DEPLOY_TOKEN: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
        run: |
          mvn -s .mvn/settings.xml --no-transfer-progress --batch-mode -Pcoverage -B \
              -Dsurefire.timeout=600 clean verify
          # Sonar analysis is disabled due to credentials:
          #   -Dsonar.host.url=${{ secrets.CG_SONAR_HOST_URL }} \
          #   -Dsonar.login=${{ secrets.CG_SONAR_LOGIN }} \
          #   sonar:sonar

      # Publish the 999-SNAPSHOT only when started with the Run workflow button on main and build is green above
      - name: Publish the 999-SNAPSHOT to the GitLab package registry
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GITLAB_DEPLOY_USER: ${{ secrets.GITLAB_DEPLOY_USER }}
          GITLAB_DEPLOY_TOKEN: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
        run: >
          mvn -s .mvn/settings.xml
          --batch-mode --no-transfer-progress
          -DskipTests
          deploy
